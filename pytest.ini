[pytest]
testpaths = tests
addopts = -ra --strict-markers -m "not external"
markers =
    unit: regras puras e determinísticas
    integration: integração local entre API, banco e módulos
    contract: contrato de adaptadores usando respostas locais
    external: verificação opt-in contra um serviço externo real
    slow: cenário local de execução prolongada

